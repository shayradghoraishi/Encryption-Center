<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="24" fill="#0b0202"/><text x="60" y="82" fill="#f2f7f5" font-family="Arial" font-size="30" font-weight="700">Security model</text><text x="60" y="112" fill="#a58a8a" font-family="Arial" font-size="14">Local-first architecture with explicit boundaries</text><g font-family="Arial"><rect x="60" y="160" width="330" height="340" rx="18" fill="#140606" stroke="#3a1414"/><text x="88" y="205" fill="#ff5a5a" font-size="16" font-weight="700">1 · Your browser</text><text x="88" y="245" fill="#e3d8d8" font-size="13">Web Crypto API</text><text x="88" y="275" fill="#e3d8d8" font-size="13">@noble/ciphers</text><text x="88" y="305" fill="#e3d8d8" font-size="13">Argon2id / PBKDF2</text><text x="88" y="335" fill="#e3d8d8" font-size="13">OpenPGP.js</text><text x="88" y="365" fill="#e3d8d8" font-size="13">Encrypted local vault</text><text x="88" y="420" fill="#a58a8a" font-size="12">No application server is required.</text></g><g font-family="Arial"><rect x="435" y="160" width="330" height="340" rx="18" fill="#140606" stroke="#3a1414"/><text x="463" y="205" fill="#ff5a5a" font-size="16" font-weight="700">2 · Optional hosting</text><text x="463" y="245" fill="#e3d8d8" font-size="13">GitHub Pages</text><text x="463" y="275" fill="#e3d8d8" font-size="13">Cloudflare Workers Assets</text><text x="463" y="305" fill="#e3d8d8" font-size="13">Any static web server</text><text x="463" y="365" fill="#a58a8a" font-size="12">Hosting delivers the application.</text><text x="463" y="390" fill="#a58a8a" font-size="12">It does not receive plaintext.</text></g><g font-family="Arial"><rect x="810" y="160" width="330" height="340" rx="18" fill="#140606" stroke="#3a1414"/><text x="838" y="205" fill="#ff5a5a" font-size="16" font-weight="700">3 · Your data</text><text x="838" y="245" fill="#e3d8d8" font-size="13">Text → local encryption</text><text x="838" y="275" fill="#e3d8d8" font-size="13">Files → local Web Worker</text><text x="838" y="305" fill="#e3d8d8" font-size="13">Keys → optional encrypted vault</text><text x="838" y="365" fill="#a58a8a" font-size="12">Browser extensions, malware,</text><text x="838" y="390" fill="#a58a8a" font-size="12">or a compromised device can still</text><text x="838" y="415" fill="#a58a8a" font-size="12">access secrets while they are in use.</text></g></svg>
